name: build-teamtalk

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  TT_REPO: https://github.com/BearWare/TeamTalk5
  TT_COMMIT: c2bed455d8a90412a31c4704db292cd58dc784d2
  NDK_VERSION: "27.2.12479018"
  ANDROID_ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK and install NDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK" || true
          export SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)"
          echo "SDKMANAGER=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          yes | "$SDKMANAGER" --sdk_root="$SDK" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Clone TeamTalk5
        run: |
          git init tt
          cd tt
          git remote add origin "${TT_REPO}"
          git fetch --depth 1 origin "${TT_COMMIT}"
          git checkout FETCH_HEAD
          echo "TeamTalk5 commit: $(git rev-parse HEAD)"

      - name: Apply Xray overlay
        run: |
          if [ -d overlay ]; then
            cp -a overlay/. tt/
          fi

      - name: Build native libraries (arm64-v8a)
        run: |
          cd tt
          cmake -S . -B build-a64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DANDROID_ABI=${ANDROID_ABI} \
            -DANDROID_PLATFORM=android-23 \
            -DBUILD_TEAMTALK_LIBRARY_LIB=ON \
            -DBUILD_TEAMTALK_LIBRARY_LIBPRO=ON \
            -DBUILD_TEAMTALK_CLIENTS=OFF \
            -DBUILD_TEAMTALK_SERVERS=OFF \
            -DBUILD_TEAMTALK_DOCUMENTATION=OFF \
            -DTOOLCHAIN_ZLIB=OFF \
            -DTOOLCHAIN_LIBVPX=OFF \
            -DTOOLCHAIN_FFMPEG=OFF \
            -DTOOLCHAIN_CATCH2=OFF \
            -DTOOLCHAIN_PORTAUDIO=OFF \
            -DFEATURE_LIBVPX=OFF \
            -DFEATURE_FFMPEG=OFF \
            -DFEATURE_WEBRTC=OFF \
            -DFEATURE_PORTAUDIO=OFF \
            -DBUILD_TEAMTALK_LIBRARY_JNI=ON \
            -DBUILD_TEAMTALK_LIBRARY_JNIPRO=OFF
          ninja -C build-a64 -t targets all 2>/dev/null | grep -i "jni\|TeamTalk5Lib" | head -20 || true
          cmake --build build-a64 -j"$(nproc)" > /tmp/native.log 2>&1 || { tail -n 120 /tmp/native.log; exit 1; }
          grep -i "jni" /tmp/native.log | tail -n 20 || true
          find . -name "*jni*.so" -o -name "libTeamTalk5*.so" | head

      - name: Show produced libs
        run: |
          ls -l tt/Library/TeamTalkJNI/libs || true
          ls -l tt/Library/TeamTalkJNI/libs/${ANDROID_ABI} || true
          ls -l tt/Library/TeamTalk_DLL/${ANDROID_ABI} || true

      - name: Build APK
        run: |
          set -o pipefail
          cd tt/Client/TeamTalkAndroid
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -n 250

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: teamtalk-xray-apk
          path: |
            tt/Client/TeamTalkAndroid/build/outputs/apk/**/*.apk
            tt/Client/TeamTalkAndroid/app/build/outputs/apk/**/*.apk
            tt/Library/TeamTalkJNI/libs/*.jar
            tt/Library/TeamTalkJNI/libs/**/*.so
          if-no-files-found: warn
